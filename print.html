<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>送付状メーカー 印刷</title>
<style>
/* ============================================================
   UKCorporation ブランド
   墨 #211613 / 鉄鼠 #424142 / 朱 #D1352F
   空き家活用研究所  深緑 #2E5744
   ============================================================ */
:root{
  --ink:#211613; --ink2:#5d534e; --ink3:#8e837d;
  --ground:#eceae6; --surface:#ffffff; --surface2:#f5f3f0;
  --line:#ded8d2; --line-strong:#c6bdb5;
  --accent:#D1352F; --accent-ink:#ffffff;
  --radius:7px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#efe9e4; --ink2:#b4aaa4; --ink3:#877d77;
    --ground:#151110; --surface:#221b18; --surface2:#2b2320;
    --line:#39312d; --line-strong:#4c433d;
    --accent-ink:#ffffff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --ink:#efe9e4; --ink2:#b4aaa4; --ink3:#877d77;
  --ground:#151110; --surface:#221b18; --surface2:#2b2320;
  --line:#39312d; --line-strong:#4c433d;
  --accent-ink:#ffffff;
  color-scheme:dark;
}

*{box-sizing:border-box}
[hidden]{display:none !important}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic Medium","Yu Gothic",Meiryo,system-ui,sans-serif;
  font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------------- shell ---------------- */
.app{display:grid; grid-template-columns:minmax(360px,404px) 1fr; min-height:100vh}
.rail{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; min-width:0}
.desk{padding:26px 16px 64px; display:flex; flex-direction:column; align-items:center; gap:14px; min-width:0; overflow-x:auto}
@media (min-width:901px){
  .app{height:100vh; overflow:hidden; grid-template-rows:minmax(0,1fr)}
  .rail{min-height:0}
  .desk{overflow-y:auto; min-height:0}
}

.brand{
  padding:15px 20px 13px; border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
}
.brand .mark{display:flex; align-items:center; min-width:0}
.brand .mark img{height:21px; width:auto; display:block}
.brand .wordmark{font-size:14px; font-weight:700; letter-spacing:.08em; white-space:nowrap}
.brand .tag{
  font-size:10px; letter-spacing:.22em; color:var(--ink3);
  border-left:1px solid var(--line-strong); padding-left:12px; white-space:nowrap;
}
.brand .mark img.logo-dk{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .brand .mark img.logo-lt{display:none}
  :root:not([data-theme="light"]) .brand .mark img.logo-dk{display:block}
}
:root[data-theme="dark"] .brand .mark img.logo-lt{display:none}
:root[data-theme="dark"] .brand .mark img.logo-dk{display:block}

.rail-scroll{flex:1; overflow-y:auto; padding:14px 20px 22px; display:flex; flex-direction:column; gap:13px}

/* ---------------- cards & controls ---------------- */
.card{border:1px solid var(--line); border-radius:var(--radius); background:var(--surface)}
.card > h2{
  margin:0; padding:9px 12px; font-size:11px; font-weight:700; letter-spacing:.14em;
  color:var(--ink2); border-bottom:1px solid var(--line);
  display:flex; align-items:center; justify-content:space-between; gap:8px;
}
.card > h2::before{
  content:""; width:3px; height:11px; background:var(--accent); border-radius:1px;
  margin-right:9px; flex:0 0 auto;
}
.card > h2 > span:first-child{flex:1; min-width:0}
.card .body{padding:12px; display:flex; flex-direction:column; gap:10px}

label.f{display:flex; flex-direction:column; gap:4px; font-size:11px; color:var(--ink2); min-width:0}
label.f > span{letter-spacing:.08em}
input[type=text],input[type=date],select,textarea{
  width:100%; padding:7px 9px; border:1px solid var(--line-strong); border-radius:5px;
  background:var(--surface); color:var(--ink);
}
input[type=color]{width:100%; height:32px; padding:2px; border:1px solid var(--line-strong); border-radius:5px; background:var(--surface)}
textarea{resize:vertical; line-height:1.8}
.row{display:flex; gap:8px; flex-wrap:wrap}
.row > *{flex:1 1 120px; min-width:0}
.row.tight > *{flex:0 0 auto}

.seg{display:flex; border:1px solid var(--line-strong); border-radius:5px; overflow:hidden}
.seg button{
  flex:1; padding:9px 6px; border:0; background:var(--surface); color:var(--ink2);
  cursor:pointer; font-size:12.5px; letter-spacing:.03em;
}
.seg button + button{border-left:1px solid var(--line-strong)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}

.btn{
  padding:7px 12px; border:1px solid var(--line-strong); border-radius:5px; background:var(--surface);
  color:var(--ink); cursor:pointer; font-size:12.5px; white-space:nowrap;
}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink); border-color:var(--ink); color:var(--surface); font-weight:700; letter-spacing:.06em}
.btn.primary:hover{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.mini{padding:3px 8px; font-size:11px}
a.btn{text-decoration:none; display:inline-flex; align-items:center}

.hint{font-size:11px; color:var(--ink3); line-height:1.55}
.more{font-size:11px; color:var(--ink3)}
.more summary{cursor:pointer; letter-spacing:.06em; padding:4px 0}
.more[open] summary{color:var(--ink2)}
.more > .row{margin-top:6px}
.more > .hint{margin:6px 0 0}
#senderEdit,#brandEdit{display:flex; flex-direction:column; gap:8px; border-top:1px dashed var(--line); padding-top:10px}

.checks{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:2px 10px}
.chk{display:flex; align-items:center; gap:6px; font-size:12px; cursor:pointer; padding:2px 0; min-width:0}
.chk input{flex:0 0 auto; margin:0; accent-color:var(--accent)}
.chk > span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.selhead{
  display:flex; align-items:center; justify-content:space-between; gap:8px; font-size:11px;
  color:var(--ink2); letter-spacing:.08em; border-top:1px solid var(--line); padding-top:10px;
}
.staffrows{display:flex; flex-direction:column; gap:6px}
.staffrow{display:grid; grid-template-columns:1fr 1.15fr 28px; gap:6px; align-items:center}
.staffrow input{padding:6px 8px; font-size:12.5px}
.staffpanel{
  border:1px solid var(--line); border-radius:6px; background:var(--surface2);
  padding:10px; display:flex; flex-direction:column; gap:8px;
}
.staffhead{display:grid; grid-template-columns:1fr 1.15fr 28px; gap:6px;
  font-size:10px; letter-spacing:.1em; color:var(--ink3)}
.staffrow.add{border-top:1px dashed var(--line-strong); padding-top:8px}
.icon-btn.ok{color:var(--accent); border-color:var(--accent); font-weight:700}
.icon-btn.ok:hover{background:var(--accent); color:#fff}

.modal{
  position:fixed; inset:0; z-index:50; background:rgba(33,22,19,.42);
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-box{
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  padding:18px; max-width:340px; width:100%; box-shadow:0 18px 48px rgba(33,22,19,.3);
  display:flex; flex-direction:column; gap:14px;
}
.modal-box p{margin:0; font-size:13px; line-height:1.7; white-space:pre-line}
.modal-btns{display:flex; gap:8px; justify-content:flex-end}
@media print{ .modal{display:none !important} }

.filebox{display:flex; align-items:center; gap:8px}
.filebox img{width:44px; height:40px; object-fit:contain; border:1px solid var(--line); border-radius:5px; background:#fff}
.filebox input[type=file]{flex:1 1 auto; font-size:11px; padding:4px; border:1px dashed var(--line-strong); border-radius:5px}

.items{display:flex; flex-direction:column; gap:6px}
.item{display:grid; grid-template-columns:1fr 86px 28px; gap:6px; align-items:center}
.icon-btn{
  width:28px; height:30px; border:1px solid var(--line-strong); border-radius:5px;
  background:var(--surface); color:var(--ink3); cursor:pointer; line-height:1; font-size:15px;
}
.icon-btn:hover{color:var(--accent); border-color:var(--accent)}

.actionbar{
  padding:12px 20px; background:var(--surface); border-top:1px solid var(--line);
  display:flex; gap:8px; align-items:center; flex-wrap:wrap;
}
.actionbar .spacer{flex:1}

.list{display:flex; flex-direction:column; gap:6px; max-height:230px; overflow-y:auto}
.entry{
  display:flex; align-items:center; gap:8px; padding:7px 9px; border:1px solid var(--line);
  border-radius:5px; background:var(--surface2); font-size:12.5px;
}
.entry .txt{flex:1; min-width:0}
.entry .txt b{display:block; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.entry .txt small{color:var(--ink3); font-size:11px}
.empty{font-size:11px; color:var(--ink3); padding:6px 2px; margin:0}

.papernote{font-size:11px; color:var(--ink3); display:flex; gap:12px; align-items:center; flex-wrap:wrap}
.zoombar{display:flex; align-items:center; gap:6px}

/* ============================================================
   用紙
   ============================================================ */
.sheet{
  --accent:#D1352F; --rule:#424142; --paper:#211613;
  width:210mm; min-height:297mm; background:#ffffff; color:var(--paper);
  padding:18mm 20mm 14mm;
  box-shadow:0 1px 2px rgba(33,22,19,.10), 0 14px 38px rgba(33,22,19,.15);
  font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","MS PMincho",serif;
  font-size:10.5pt; line-height:1.95; letter-spacing:.02em;
  display:flex; flex-direction:column;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.sheet.gothic{font-family:"Yu Gothic","YuGothic","Hiragino Kaku Gothic ProN","Hiragino Sans",Meiryo,sans-serif}

/* レターヘッド */
.lh{display:flex; align-items:flex-end; justify-content:space-between; gap:10mm}
.lh-mark{display:flex; align-items:center; gap:3mm; min-width:0}
.lh-mark img{display:block; height:auto}
.lh-word{display:flex; align-items:center; gap:3mm}
.lh-word i{display:block; width:1.2mm; height:7mm; background:var(--accent); font-style:normal}
.lh-word b{font-weight:700; font-size:13pt; letter-spacing:.1em; white-space:nowrap}
.lh-date{font-size:10.5pt; white-space:nowrap; padding-bottom:.6mm}
.lh-rule{margin-top:3.2mm; border-top:.25mm solid var(--rule); position:relative; height:0}
.lh-rule::before{
  content:""; position:absolute; left:0; top:-.55mm; width:17mm; height:0;
  border-top:1.1mm solid var(--accent);
}

.head{display:flex; justify-content:space-between; align-items:flex-start; gap:12mm; margin-top:9mm}
.to{padding-top:1mm}
.to .nm{font-size:12.5pt; letter-spacing:.04em}
.from{font-size:9.5pt; line-height:1.8}
.from .co{font-weight:700; font-size:11pt; letter-spacing:.05em; margin-bottom:.6mm}
.from .conm{position:relative; display:inline-block}
.from .seal{position:absolute; right:-6mm; top:50%; transform:translateY(-32%); pointer-events:none}
.from .meta{color:#3e3532}

.title{margin:13mm 0 0; text-align:center}
.title b{font-weight:700; font-size:14pt; letter-spacing:.55em; text-indent:.55em; display:inline-block}
.title .u{
  width:30mm; margin:2.4mm auto 0; height:0; border-top:.25mm solid var(--rule);
}

.letter{margin-top:9mm}
.letter p{margin:0}
.letter .op{margin-bottom:1.2mm}
.letter .tx{text-indent:1em}
.letter .cl{text-align:right; margin-top:1.2mm}

.ki{text-align:center; margin-top:8mm; letter-spacing:.34em; text-indent:.34em; font-weight:700}
.sheet table{border-collapse:collapse; width:80%; margin:5mm auto 0; font-size:10.5pt}
.sheet caption{display:none}
.sheet th,.sheet td{padding:2.3mm 4mm; border-left:.2mm solid var(--rule); border-right:.2mm solid var(--rule)}
.sheet thead th{
  font-weight:700; letter-spacing:.18em; font-size:10pt; text-align:center;
  border-top:.45mm solid var(--paper); border-bottom:.45mm solid var(--paper);
}
.sheet tbody td{text-align:center; border-bottom:.2mm solid var(--rule)}
.sheet tbody tr:last-child td{border-bottom:.45mm solid var(--paper)}
.sheet tbody td.nm{text-align:left}
.sheet tbody td .idx{color:#6b615d; margin-right:1.5mm}

.note{margin:6mm 0 0; white-space:pre-line; font-size:9.5pt; line-height:1.85}
.ijo{text-align:right; margin-top:auto; padding-top:9mm; letter-spacing:.34em; font-weight:700}
.lf{
  margin-top:5mm; padding-top:2.2mm; border-top:.25mm solid var(--rule);
  font-size:8pt; letter-spacing:.04em; color:#4a413d; line-height:1.6;
  display:flex; justify-content:space-between; gap:6mm; flex-wrap:wrap;
}
.lf .sep{color:var(--accent)}

/* ---------------- 封筒 ---------------- */
.env{
  background:#fff; color:#211613; position:relative;
  box-shadow:0 1px 2px rgba(33,22,19,.10), 0 14px 38px rgba(33,22,19,.15);
  font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","MS PMincho",serif;
  -webkit-print-color-adjust:exact; print-color-adjust:exact;
}
.env.n3{width:235mm; height:120mm}
.env.k2{width:332mm; height:240mm}
.env .e-to{position:absolute; left:14%; top:28%; width:70%; line-height:1.9}
.env .e-to .zip{letter-spacing:.35em; font-size:11pt}
.env .e-to .ad{font-size:12pt; margin-top:3mm}
.env .e-to .nm{font-size:17pt; margin-top:6mm; letter-spacing:.08em; white-space:pre-line}
.env .e-from{position:absolute; left:8%; bottom:8%; font-size:9.5pt; line-height:1.7; white-space:pre-line}
.env .e-from img{display:block; height:7mm; width:auto; margin-bottom:1.6mm}
.env.k2 .e-to .nm{font-size:22pt}
.env.k2 .e-from{font-size:11pt}
.env.k2 .e-from img{height:9mm}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{border-right:0; border-bottom:1px solid var(--line)}
  .desk{padding:16px}
}

@media print{
  body{background:#fff}
  .rail,.papernote{display:none !important}
  .app{display:block; height:auto; overflow:visible}
  .desk{padding:0; display:block; overflow:visible}
  .sheet,.env{box-shadow:none; zoom:1 !important; margin:0}
  body.mode-letter .env{display:none !important}
  body.mode-env .sheet{display:none !important}
}
body.mode-env .sheet{display:none}
body.mode-letter .env{display:none}

/* ============================================================
   印刷専用ページ（送付状メーカー本体から開かれる）
   ============================================================ */
html,body{margin:0;padding:0;background:#fff}
.sheet,.env{box-shadow:none !important;zoom:1 !important;margin:0 !important}
#pbar{
  position:fixed;left:0;top:0;right:0;z-index:9;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;background:#211613;color:#fff;
  font:13px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
}
#pbar #pmsg{flex:1 1 260px}
#pbar kbd{
  display:inline-block;padding:1px 7px;margin:0 1px;border-radius:4px;background:#fff;color:#211613;
  font:700 12px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif;
}
#pbar button{padding:6px 14px;border:0;border-radius:5px;background:#D1352F;color:#fff;font:inherit;font-weight:700;cursor:pointer}
#pbar button.x{background:transparent;border:1px solid rgba(255,255,255,.45);font-weight:400}
#pbar.key{background:#D1352F}
#pbar.key kbd{color:#D1352F}
#empty{margin:120px 16px;text-align:center;color:#5d534e;font:14px/1.8 -apple-system,BlinkMacSystemFont,"Hiragino Sans",Meiryo,sans-serif}
@media screen{
  body{background:#eceae6;padding:72px 16px 24px}
  .sheet,.env{margin:0 auto !important;box-shadow:0 8px 30px rgba(0,0,0,.18) !important}
}
@media print{#pbar,#empty{display:none !important}}
</style>
<style id="pageStyle">@page{size:A4;margin:0}</style>
</head>
<body>
<div id="pbar">
  <span id="pmsg">印刷画面を開いています…</span>
  <button type="button" id="pbtn">印刷画面を開く</button>
  <button type="button" class="x" id="pcls">閉じる</button>
</div>
<main id="paper"></main>
<p id="empty" hidden>印刷するものがありません。送付状メーカーの「印刷」ボタンから開いてください。</p>

const $ = id => document.getElementById(id);

function fromB64Url(s){
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while(s.length % 4) s += "=";
  return decodeURIComponent(escape(atob(s)));
}
/* 本体が渡した内容を受け取る。同じ保存領域（localStorage）を優先し、URLの末尾（#）は予備 */
function load(){
  let raw = null;
  try{ raw = localStorage.getItem("soufujo:print"); }catch(e){ raw = null; }
  if(raw){
    try{ const p = JSON.parse(raw); if(p && p.html && Date.now() - (p.at || 0) < 5 * 60 * 1000) return p; }catch(e){}
  }
  const h = location.hash.replace(/^#/, "");
  if(h.length > 20){
    try{ const p = JSON.parse(fromB64Url(h)); if(p && p.html) return p; }catch(e){}
  }
  return null;
}
/* 受け取ったHTMLは用紙の中身だけを許可して組み立て直す（スクリプト等は通さない） */
const TAGS  = new Set(["DIV","SPAN","P","B","I","IMG","TABLE","THEAD","TBODY","TR","TH","TD","HEADER","FOOTER","BR","SMALL"]);
const ATTRS = new Set(["class","id","style","alt","width","height"]);
function clean(node, out){
  Array.from(node.childNodes).forEach(c=>{
    if(c.nodeType === 3){ out.appendChild(document.createTextNode(c.nodeValue)); return; }
    if(c.nodeType !== 1 || !TAGS.has(c.tagName)) return;
    const el = document.createElement(c.tagName.toLowerCase());
    Array.from(c.attributes).forEach(a=>{
      if(ATTRS.has(a.name)) el.setAttribute(a.name, a.value);
      else if(a.name === "src" && c.tagName === "IMG"){
        const v = a.value;
        if(v === "@builtin-logo") el.src = LOGO_UK;
        else if(v === "@builtin-seal") el.src = SEAL_UK;
        else if(/^data:image\/(png|jpeg|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(v)) el.src = v;
      }
    });
    clean(c, el);
    out.appendChild(el);
  });
}

const p = load();
if(!p){ $("empty").hidden = false; $("pbar").hidden = true; return; }
document.title = p.title || "送付状";
$("pageStyle").textContent = "@page{size:" + (/^[A-Za-z0-9 .]+$/.test(p.page || "") ? p.page : "A4") + ";margin:0}";
clean(new DOMParser().parseFromString(p.html, "text/html").body, $("paper"));
try{ localStorage.setItem("soufujo:print:ack", String(Date.now())); }catch(e){}

/* 印刷画面を出す。出せない環境（claude.ai の制限を引き継いだタブ）ではキー操作を案内する */
let fired = false;
const bar = $("pbar"), msg = $("pmsg"), btn = $("pbtn");
window.addEventListener("beforeprint", ()=>{
  fired = true; bar.className = ""; btn.hidden = true;
  msg.textContent = "印刷またはキャンセルすると、このタブは自動で閉じます。";
});
window.addEventListener("afterprint", ()=>{ setTimeout(()=>{ try{ window.close(); }catch(e){} }, 400); });
function go(){ try{ window.print(); }catch(e){} }
btn.onclick = go;
$("pcls").onclick = ()=>{ try{ window.close(); }catch(e){} };
document.addEventListener("keydown", e=>{ if(e.key === "Escape"){ try{ window.close(); }catch(x){} } });
function start(){
  setTimeout(()=>{
    go();
    setTimeout(()=>{
      if(fired) return;
      bar.className = "key"; btn.hidden = true;
      msg.innerHTML = "このタブではキーボードの <kbd>Ctrl</kbd>+<kbd>P</kbd>（Macは <kbd>\u2318</kbd>+<kbd>P</kbd>）で印刷画面が開きます。";
    }, 700);
  }, 250);
}
if(document.readyState === "complete") start(); else window.addEventListener("load", start);
})();
</script>
