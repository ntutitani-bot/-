# 送付状メーカーを GitHub Pages に公開する（push のたびに gh-pages ブランチへ書き出し、自動で更新）
name: Deploy to GitHub Pages

on:
  push:
    branches: ["claude/delivery-note-maker-improve-h89eud"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp "送付状メーカー.html" _site/index.html
          touch _site/.nojekyll
      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "公開ページを更新"
